<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة الثعبان</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: white;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    canvas {
      background-color: #000;
      border: 3px solid #4CAF50;
      box-shadow: 0 0 10px rgba(0,255,0,0.5);
    }
    #score {
      font-size: 20px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <h2>لعبة الثعبان الكلاسيكية</h2>
  <div id="score">النتيجة: 0</div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{x: 10, y: 10}];
    let food = {x: 15, y: 15};
    let dx = 0;
    let dy = 0;
    let score = 0;

    function drawGame() {
      moveSnake();
      if (checkGameOver()) return;

      clearCanvas();
      checkFoodCollision();
      drawFood();
      drawSnake();

      setTimeout(drawGame, 100);
    }

    function clearCanvas() {
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
      ctx.fillStyle = "lime";
      snake.forEach((part, index) => {
        if (index === 0) ctx.fillStyle = "green"; // رأس الثعبان
        else ctx.fillStyle = "lime";
        ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
      });
    }

    function moveSnake() {
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};
      snake.unshift(head);
      if (!(head.x === food.x && head.y === food.y)) {
        snake.pop();
      }
    }

    function drawFood() {
      ctx.fillStyle = "red";
      ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
    }

    function checkFoodCollision() {
      if (snake[0].x === food.x && snake[0].y === food.y) {
        score += 10;
        scoreElement.innerText = "النتيجة: " + score;
        generateFood();
      }
    }

    function generateFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);
    }

    function checkGameOver() {
      const head = snake[0];
      
      // الاصطدام بالجدران
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        resetGame();
        return true;
      }

      // الاصطدام بجسم الثعبان
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          resetGame();
          return true;
        }
      }
      return false;
    }

    function resetGame() {
      alert("خسرت! النتيجة النهائبة: " + score);
      snake = [{x: 10, y: 10}];
      dx = 0;
      dy = 0;
      score = 0;
      scoreElement.innerText = "النتيجة: " + score;
      generateFood();
      drawGame();
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" && dy !== 1) { dx = 0; dy = -1; }
      if (e.key === "ArrowDown" && dy !== -1) { dx = 0; dy = 1; }
      if (e.key === "ArrowLeft" && dx !== 1) { dx = -1; dy = 0; }
      if (e.key === "ArrowRight" && dx !== -1) { dx = 1; dy = 0; }
    });

    drawGame();
  </script>
</body>
</html>
